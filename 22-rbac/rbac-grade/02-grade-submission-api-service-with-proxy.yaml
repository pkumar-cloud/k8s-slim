apiVersion: v1
kind: Service
metadata:
  name: grade-submission-api
  namespace: grade-demo
spec:
  type: NodePort
  selector:
    app: grade-submission
  ports:
  - port: 8443 
    targetPort: https #point to kube-rbac-proxy container port
    nodePort: 31000
#when a request is made on local host 31000 of our node Port, it's going to be 
#redirected to the great submission API pod on the target Port 8443, 
#where it's going to validate the request and see if it's actually authorized and send it upstream to the great submission api's port 3000. 
